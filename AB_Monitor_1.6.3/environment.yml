# ===========================================================================
# environment.yml - AB Power Meter toolset, Python 3.12 (primary target)
# ---------------------------------------------------------------------------
# Version : 1.6.0   Modified: 2026-10-26
# Mamba creates the interpreter + pip; pip installs the packages from
# requirements-py312.txt (conda owns the interpreter, pip owns the packages,
# which avoids conda-forge / PyPI name and version mismatches).
#
# Create:   mamba env create -f environment.yml
# Update:   mamba env update -f environment.yml --prune
# Activate: mamba activate abmeter
# Run from the folder that contains requirements-py312.txt.
# Other interpreters: environment-py37.yml (3.7.11); for 3.8-3.11 edit the
# python line and use requirements.txt.
# ===========================================================================
name: abmeter
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements-py312.txt
