# ===========================================================================
# abmeter_logrotate.conf — logrotate policy for on-disk monitor logs
# ---------------------------------------------------------------------------
# Installed (system mode only) to /etc/logrotate.d/abmeter by install.sh,
# which substitutes __INSTALL_DIR__.  Applies only when ENABLE_LOG_FILE=1 in
# ab_power_meter_monitor.py (journald handles the service's own stdout/stderr).
# ===========================================================================
__INSTALL_DIR__/ab_meter_output/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
